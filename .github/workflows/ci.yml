name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Gatehouse.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Gatehouse.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Gatehouse.slnx --configuration Release --no-restore

      - name: Install browser
        run: pwsh tests/Gatehouse.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test Gatehouse.slnx --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          GATEHOUSE_SCREENSHOT_PATH: ${{ github.workspace }}/artifacts/browser/gatehouse-dashboard.png

      - name: Pack command-line tool
        run: |
          dotnet pack src/Gatehouse.Domain/Gatehouse.Domain.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Gatehouse.Application/Gatehouse.Application.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Gatehouse.Infrastructure/Gatehouse.Infrastructure.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Gatehouse.Web/Gatehouse.Web.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Gatehouse.Cli/Gatehouse.Cli.csproj --configuration Release --no-build --output artifacts/packages

      - name: Save release packages
        uses: actions/upload-artifact@v4
        with:
          name: gatehouse-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: Install and run packed command-line tool
        run: |
          mkdir -p artifacts/tool artifacts/tool-sandbox
          dotnet tool install Gatehouse --tool-path artifacts/tool --version 1.0.0 --add-source artifacts/packages --ignore-failed-sources
          artifacts/tool/gatehouse version | grep -F "Gatehouse 1.0.0"
          pushd artifacts/tool-sandbox
          set +e
          ../tool/gatehouse status --demo --json > status.json
          status_code=$?
          set -e
          test "$status_code" -eq 2
          python3 -c 'import json; data=json.load(open("status.json")); assert data["schemaVersion"] == "1.0" and len(data["pullRequests"]) == 5'
          ../tool/gatehouse --data gatehouse.db repo add octocat/hello-world --json > repository.json
          python3 -c 'import json; data=json.load(open("repository.json")); assert data["repository"] == "octocat/hello-world"'
          ../tool/gatehouse --data gatehouse.db serve --port 5349 > serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5349/api/v1/health > health.json; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat serve.log
              exit 1
            fi
            sleep 1
          done
          if ! test -s health.json; then
            cat serve.log
            exit 1
          fi
          python3 -c 'import json; data=json.load(open("health.json")); assert data == {"status": "ok", "version": "1"}'
          curl --fail --silent http://localhost:5349/repositories > dashboard.html
          grep -F "Add a public or token-accessible GitHub repository" dashboard.html
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          popd

      - name: Save dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatehouse-dashboard
          path: artifacts/browser/gatehouse-dashboard.png
          if-no-files-found: ignore

      - name: Check vulnerable dependencies
        run: dotnet list Gatehouse.slnx package --vulnerable --include-transitive

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          name: gatehouse-packages
          path: artifacts/packages

      - name: Install and run exact release package
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "artifacts/packages"
          $toolPath = Join-Path $PWD "artifacts/tool"
          $sandbox = Join-Path $PWD "artifacts/package-smoke"
          New-Item -ItemType Directory -Force $toolPath, $sandbox | Out-Null

          dotnet tool install Gatehouse `
            --tool-path $toolPath `
            --version 1.0.0 `
            --add-source $packagePath `
            --ignore-failed-sources `
            --no-cache
          if ($LASTEXITCODE -ne 0) { throw "Tool installation failed." }

          $command = Join-Path $toolPath $(if ($IsWindows) { "gatehouse.exe" } else { "gatehouse" })
          $version = & $command version
          if ($LASTEXITCODE -ne 0 -or $version -ne "Gatehouse 1.0.0") {
            throw "Version smoke test failed: $version"
          }

          $statusJson = & $command status --demo --json
          $statusExit = $LASTEXITCODE
          if ($statusExit -ne 2) { throw "Demo status returned $statusExit instead of 2." }
          $status = $statusJson | ConvertFrom-Json
          if ($status.schemaVersion -ne "1.0" -or $status.pullRequests.Count -ne 5) {
            throw "Demo JSON contract failed."
          }

          $database = Join-Path $sandbox "gatehouse.db"
          $repositoryJson = & $command --data $database repo add octocat/hello-world --json
          if ($LASTEXITCODE -ne 0) { throw "Local database migration failed." }
          $repository = $repositoryJson | ConvertFrom-Json
          if ($repository.schemaVersion -ne "1.0" -or
              $repository.repository -ne "octocat/hello-world") {
            throw "Repository JSON contract failed."
          }
